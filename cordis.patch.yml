# Harness UI enhancement. webServer is provided by the web profile.
- insert:
    - id: dsh-workspace
      name: 'dsh-workspace'
      config:
        baseUrl: https://api.deepseek.com
        apiKeyEnv: DEEPSEEK_API_KEY
        # Local timezone for the "today" boundary: Europe/Berlin (UTC+2 CEST / UTC+1 CET).
        timezoneOffsetMinutes: 120
        balanceTimeoutMs: 5000
        inspectConcurrency: 8
        projectMaxEntries: 2000
        projectMaxFileBytes: 200000
        allowRemote: false
